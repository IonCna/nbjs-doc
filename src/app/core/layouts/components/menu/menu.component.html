<ng-template ng-ref="menuContent">
    <nav class="px-2" aria-label="Documentation navigation">
        <div class="accordion accordion-flush rounded-3 overflow-hidden" ngb-accordion close-others="false">
            <div ngb-accordion-item="getting-started" collapsed="false">
                <h2 ngb-accordion-header>
                    <button class="fw-semibold" ngb-accordion-button>
                        <i class="bi bi-rocket-takeoff me-2" aria-hidden="true"></i>
                        Getting started
                    </button>
                </h2>

                <div ngb-accordion-collapse>
                    <div ngb-accordion-body>
                        <ng-template>
                            <div class="list-group list-group-flush py-1">
                                <button class="list-group-item list-group-item-action border-0 rounded-2 px-3 py-2 text-start" type="button">
                                    Introduction
                                </button>
                                <button class="list-group-item list-group-item-action border-0 rounded-2 px-3 py-2 text-start" type="button">
                                    Installation
                                </button>
                                <button class="list-group-item list-group-item-action border-0 rounded-2 px-3 py-2 text-start" type="button">
                                    Quick start
                                </button>
                                <button class="list-group-item list-group-item-action border-0 rounded-2 px-3 py-2 text-start" type="button">
                                    Project structure
                                </button>
                            </div>
                        </ng-template>
                    </div>
                </div>
            </div>

            <div ngb-accordion-item="components">
                <h2 ngb-accordion-header>
                    <button class="fw-semibold" ngb-accordion-button>
                        <i class="bi bi-grid me-2" aria-hidden="true"></i>
                        Components
                    </button>
                </h2>

                <div ngb-accordion-collapse>
                    <div ngb-accordion-body>
                        <ng-template>
                            <div class="list-group list-group-flush py-1">
                                <button class="list-group-item list-group-item-action border-0 rounded-2 px-3 py-2 text-start" type="button">
                                    Accordion
                                </button>
                                <button class="list-group-item list-group-item-action border-0 rounded-2 px-3 py-2 text-start" type="button">
                                    Alert
                                </button>
                                <button class="list-group-item list-group-item-action border-0 rounded-2 px-3 py-2 text-start" type="button">
                                    Datepicker
                                </button>
                                <button class="list-group-item list-group-item-action border-0 rounded-2 px-3 py-2 text-start" type="button">
                                    Modal
                                </button>
                                <button class="list-group-item list-group-item-action border-0 rounded-2 px-3 py-2 text-start" type="button">
                                    Offcanvas
                                </button>
                                <button class="list-group-item list-group-item-action border-0 rounded-2 px-3 py-2 text-start" type="button">
                                    Progress bar
                                </button>
                            </div>
                        </ng-template>
                    </div>
                </div>
            </div>

            <div ngb-accordion-item="guides">
                <h2 ngb-accordion-header>
                    <button class="fw-semibold" ngb-accordion-button>
                        <i class="bi bi-journal-code me-2" aria-hidden="true"></i>
                        Guides
                    </button>
                </h2>

                <div ngb-accordion-collapse>
                    <div ngb-accordion-body>
                        <ng-template>
                            <div class="list-group list-group-flush py-1">
                                <button class="list-group-item list-group-item-action border-0 rounded-2 px-3 py-2 text-start" type="button">
                                    Accessibility
                                </button>
                                <button class="list-group-item list-group-item-action border-0 rounded-2 px-3 py-2 text-start" type="button">
                                    Customization
                                </button>
                                <button class="list-group-item list-group-item-action border-0 rounded-2 px-3 py-2 text-start" type="button">
                                    Theming
                                </button>
                                <button class="list-group-item list-group-item-action border-0 rounded-2 px-3 py-2 text-start" type="button">
                                    Migration
                                </button>
                            </div>
                        </ng-template>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</ng-template>

<div class="h-100 d-flex flex-column bg-body-tertiary" ng-if="$.mode === 'mobile'">
    <div class="offcanvas-header border-bottom px-4 py-3">
        <div class="d-flex align-items-center gap-2">
            <span class="badge text-bg-primary rounded-pill">Docs</span>
            <div>
                <h2 id="docs-mobile-menu-title" class="offcanvas-title h5 mb-0">ngb-js</h2>
                <p class="small text-body-secondary mb-0">Documentation</p>
            </div>
        </div>

        <button
            type="button"
            class="btn-close"
            aria-label="Close menu"
            ng-click="$.ngbActiveOffcanvas.dismiss('Cross click')">
        </button>
    </div>

    <div class="offcanvas-body overflow-y-auto px-2 py-3">
        <ng-container ng-template-outlet="menuContent"></ng-container>
    </div>

    <div class="d-flex align-items-center justify-content-between border-top px-4 py-3 text-body-secondary">
        <small>ngb-js documentation</small>
        <a class="link-secondary" href="" aria-label="GitHub repository">
            <i class="bi bi-github" aria-hidden="true"></i>
        </a>
    </div>
</div>

<aside class="d-none d-lg-flex w-100 min-vh-100 flex-column px-2 py-3" ng-if="$.mode === 'desktop'">
    <div class="px-2 mb-3">
        <div class="d-flex align-items-center gap-2 mb-1">
            <span class="badge text-bg-primary rounded-pill">Docs</span>
            <h2 class="h6 mb-0">Documentation</h2>
        </div>
        <p class="small text-body-secondary mb-0">Build with ngb-js.</p>
    </div>

    <hr class="my-0 mb-2">

    <div class="flex-grow-1">
        <ng-container ng-template-outlet="menuContent"></ng-container>
    </div>
</aside>
