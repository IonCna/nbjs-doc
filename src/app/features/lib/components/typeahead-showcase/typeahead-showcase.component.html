<label class="form-label" for="typeahead-showcase">Search a frontend technology</label>
<input id="typeahead-showcase" class="form-control" type="text" ng-model="example.value" ngb-typeahead="example.search" select-on-exact="true" show-hint="true" placeholder="Try ng or boot">
<p class="small text-body-secondary mt-2 mb-0">Model: <strong>{{ example.value || 'empty' }}</strong></p>
