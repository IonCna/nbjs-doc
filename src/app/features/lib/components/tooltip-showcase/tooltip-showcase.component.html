<div class="form-check form-switch mb-3"><input id="tooltip-disabled" class="form-check-input" type="checkbox" ng-model="example.disabled"><label class="form-check-label" for="tooltip-disabled">Disable tooltips</label></div>
<div class="d-flex flex-wrap gap-2">
    <button class="btn btn-outline-primary" type="button" ngb-tooltip="'Default hover and focus triggers'" disable-tooltip="example.disabled">Default</button>
    <button class="btn btn-outline-primary" type="button" ngb-tooltip="'Click again to close'" triggers="'click'" disable-tooltip="example.disabled">Click trigger</button>
    <button class="btn btn-outline-primary" type="button" ngb-tooltip="'Rendered under body'" container="'body'" placement="'top'" tooltip-class="bg-dark text-white" disable-tooltip="example.disabled">Body + custom class</button>
</div>
