<button class="btn btn-sm btn-outline-primary mb-3" type="button" ng-click="example.reset()">Recreate toast</button>
<div class="toast-container position-static">
    <ngb-toast ng-if="example.visible" animation="true" autohide="true" delay="5000">
        <ng-template ngb-toast-header><strong class="me-auto">NgbJS</strong><small>now</small></ng-template>
        This toast has a custom header and closes automatically after five seconds.
    </ngb-toast>
</div>
