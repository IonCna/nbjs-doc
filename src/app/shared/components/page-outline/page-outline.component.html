<aside class="position-sticky top-0 px-4 py-5">
    <nav ngb-scroll-spy-menu aria-label="On this page">
        <div class="d-flex align-items-center gap-2 mb-3">
            <i class="bi bi-list-nested text-primary" aria-hidden="true"></i>
            <h2 class="small fw-bold text-uppercase text-body-secondary mb-0">On this page</h2>
        </div>

        <div class="nav nav-underline flex-column align-items-start gap-2 border-start border-2 ps-3">
            <button
                class="nav-link rounded-0 px-0 py-1 text-start small"
                type="button"
                ng-repeat="section in $.sections track by section.id"
                ngb-scroll-spy-item="{{ section.id }}">
                {{ section.name }}
            </button>
        </div>
    </nav>

    <div ng-if="$.bootstrapHref || $.ngBootstrapHref">
        <hr class="my-4">

        <div class="d-flex align-items-center gap-2 mb-3">
            <i class="bi bi-journal-bookmark text-primary" aria-hidden="true"></i>
            <h2 class="small fw-bold text-uppercase text-body-secondary mb-0">Related documentation</h2>
        </div>

        <nav class="nav flex-column gap-1" aria-label="Related documentation">
            <a
                class="nav-link d-flex align-items-center gap-3 rounded-2 px-2 py-2 text-body"
                ng-if="$.bootstrapHref"
                ng-href="{{ $.bootstrapHref }}"
                target="_blank"
                rel="noopener noreferrer">
                <i class="bi bi-bootstrap fs-5 text-primary" aria-hidden="true"></i>
                <span class="flex-grow-1 small fw-semibold">{{ $.title }} in Bootstrap</span>
                <i class="bi bi-box-arrow-up-right small text-body-secondary" aria-hidden="true"></i>
            </a>

            <a
                class="nav-link d-flex align-items-center gap-3 rounded-2 px-2 py-2 text-body"
                ng-if="$.ngBootstrapHref"
                ng-href="{{ $.ngBootstrapHref }}"
                target="_blank"
                rel="noopener noreferrer">
                <i class="bi bi-boxes fs-5 text-primary" aria-hidden="true"></i>
                <span class="flex-grow-1 small fw-semibold">{{ $.title }} in ng-bootstrap</span>
                <i class="bi bi-box-arrow-up-right small text-body-secondary" aria-hidden="true"></i>
            </a>
        </nav>
    </div>
</aside>
